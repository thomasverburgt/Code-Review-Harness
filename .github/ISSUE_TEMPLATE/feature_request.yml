name: Feature request
description: Propose a capability, architecture, or documentation improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Describe the mission, engineering, governance, or contributor need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe scope, boundaries, and expected outputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Architecture and authority impact
      description: Identify affected agents, contracts, schemas, evidence, traceability, human authority, and risks.
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: ADR likely required?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true