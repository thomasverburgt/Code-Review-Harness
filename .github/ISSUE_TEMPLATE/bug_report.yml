name: Bug report
description: Report a reproducible defect in the project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here. Follow SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact steps, inputs, artifact IDs, versions, or commit SHA.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Include logs, outputs, affected contracts, traceability impact, and confidence.
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Contribution policy
      options:
        - label: I have read the Code of Conduct and Security Policy.
          required: true