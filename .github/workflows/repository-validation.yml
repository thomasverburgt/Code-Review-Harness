name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository structure
        run: python tools/check_repository_structure.py
      - name: Verify controlled release manifests
        run: python tools/build_release_manifests.py --check
      - name: Verify fixture and evidence catalogs
        run: python tools/build_artifact_catalogs.py --check
      - name: Install document-builder dependency
        run: python -m pip install -r requirements-docs.txt
      - name: Verify controlled document builders
        run: python tools/verify_document_builders.py
      - name: Validate executable vertical
        run: python tools/validate_vertical_slice.py
      - name: Run regression suite
        run: python -m unittest discover -s tools -p "test_*.py"
