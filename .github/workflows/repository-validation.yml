name: Repository validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structural-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository structure
        run: python tools/check_repository_structure.py
      - name: Validate executable vertical
        run: python tools/validate_vertical_slice.py
      - name: Run regression suite
        run: python -m unittest discover -s tools -p "test_*.py"
