name: Update AGPL license

on:
  push:
    branches:
      - agent/adopt-agpl3-community-governance
    paths:
      - .github/workflows/update-agpl-license.yml

permissions:
  contents: write

jobs:
  update-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/adopt-agpl3-community-governance

      - name: Install official GNU AGPLv3 text
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://www.gnu.org/licenses/agpl-3.0.txt \
            --output LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 19 November 2007" LICENSE
          grep -q "END OF TERMS AND CONDITIONS" LICENSE
          rm -f \
            LICENSE.full-test \
            LICENSE.test-note \
            LICENSE.placeholder-cleanup-note \
            LICENSE.full-placeholder

      - name: Commit license update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git add -u
          if git diff --cached --quiet; then
            echo "No license changes required."
            exit 0
          fi
          git commit -m "legal: install complete GNU AGPLv3 text"
          git push origin HEAD:agent/adopt-agpl3-community-governance
